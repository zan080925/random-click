<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>点击随机 · 背景与文字</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.8s cubic-bezier(.4, 0, .2, 1);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .text {
    max-width: 90vw;
    font-size: clamp(1.6rem, 6vw, 3.4rem);
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.04em;
    /* 初始颜色由 JS 控制，CSS 这里只做兜底 */
    color: #fff;
    text-shadow: 0 2px 18px rgba(0,0,0,.28), 0 1px 4px rgba(0,0,0,.25);
    word-break: break-word;
    opacity: 0;
    transform: translateY(18px) scale(.92);
    transition: opacity .45s ease,
                transform .45s cubic-bezier(.2,.9,.3,1.2),
                color .55s ease,
                text-shadow .55s ease;
  }

  .text.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .hint {
    position: absolute;
    bottom: clamp(20px, 4vh, 40px);
    left: 50%;
    transform: translateX(-50%);
    font-size: .9rem;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 6px rgba(0,0,0,.3);
    letter-spacing: .06em;
    animation: breathe 2.4s ease-in-out infinite;
    pointer-events: none;
    transition: color .55s ease, text-shadow .55s ease;
  }

  .counter {
    position: absolute;
    top: clamp(16px, 3vh, 28px);
    right: clamp(16px, 3vw, 32px);
    font-size: .85rem;
    color: rgba(255,255,255,.9);
    text-shadow: 0 1px 6px rgba(0,0,0,.3);
    background: rgba(0,0,0,.14);
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    transition: color .55s ease;
  }

  /* 点击特效：社会主义核心价值观词语 */
  .spark {
    position: fixed;
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: .06em;
    white-space: nowrap;
    pointer-events: none;
    will-change: transform, opacity;
    -webkit-text-stroke: 0.6px rgba(255,255,255,.55);
    text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 0 12px rgba(0,0,0,.35);
  }

  @keyframes breathe {
    0%, 100% { opacity: .55; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.05); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="counter" id="counter">点击 0 次</div>
    <div class="text" id="text">点我一下试试</div>
    <div class="hint">— 点击任意处 · 随机换背景 &amp; 文字 —</div>
  </div>

<script>
  (function () {
    // 元素获取 + 空值保护
    const textEl = document.getElementById('text');
    const counterEl = document.getElementById('counter');
    const hintEl = document.querySelector('.hint');

    let clicks = 0;
    let lastBgIndex = -1;
    let lastColor = '';

    const backgrounds = [
      { bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #5ee7df 0%, #b490ca 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #c471f5 0%, #fa71cd 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #0ba360 0%, #3cba92 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #2af598 0%, #009efd 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #fc6076 0%, #ff9a44 100%)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #7f00ff 0%, #e100ff 100%)', tone: 'light' },
      { bg: '#1d1d2b', tone: 'light' },
      { bg: '#141e30', tone: 'light' },
      { bg: '#0f2027', tone: 'light' },
      { bg: '#2b2b2b', tone: 'light' },
      { bg: 'radial-gradient(circle at 30% 30%, #ffd86f, #fc6262)', tone: 'dark' },
      { bg: 'radial-gradient(circle at 70% 20%, #89f7fe, #66a6ff)', tone: 'dark' },
      { bg: 'repeating-linear-gradient(45deg, #ff6b6b 0 24px, #feca57 24px 48px)', tone: 'dark' },
      { bg: 'linear-gradient(135deg, #232526 0%, #414345 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #41295a 0%, #2f0743 100%)', tone: 'light' },
      { bg: 'linear-gradient(135deg, #3e5151 0%, #decba4 100%)', tone: 'light' }
    ];

    const lines = [
      '点我一下试试', '你好呀 👋', '今天也要开心呀', '你笑起来真好看',
      '又是元气满满的一天', '随机掉落一份好运', '心想事成 ✨', '万事胜意',
      '保持热爱', '奔赴山海', '你值得所有美好', '好运正在派送中',
      '再点一下，惊喜加倍', '别停，继续点', '这颜色好看吗？', '换个心情吧',
      '世界那么大，先去点一点', '今天吃什么？', '早点睡，别熬夜', '记得喝水',
      '努力的人最可爱', '你超棒的', '慢慢来，比较快', '一切都是最好的安排',
      '平安喜乐', '温柔且坚定', '所愿皆所得', '未来可期',
      '随机到我了，开心', '又是被点的一天', '点我的人会有好事发生', '冲鸭 🦆',
      '干饭不积极，思想有问题', '摸鱼一时爽，一直摸鱼一直爽', '发个呆吧', '深呼吸',
      '去爱，去生活，去受伤', '你是限量版', '别慌，月亮也照常升起', '慢慢变好',
      '今天的风很温柔', '偷偷许个愿', '好运连连', '暴富预警 💰',
      '开心最重要', '把烦恼都点掉', '一键清空不开心', '点击收获快乐',
      '生活明朗', '万物可爱', '心存美好', '静待花开',
      '冲就完了', '干得漂亮', '继续前进', '别回头',
      '做个温柔的人', '眼里有光', '心里有火', '兜里有糖',
      '嘿嘿嘿', '再来一下嘛', '上瘾了吧', '根本停不下来'
    ];

    const coreValues = [
      '富强', '民主', '文明', '和谐',
      '自由', '平等', '公正', '法治',
      '爱国', '敬业', '诚信', '友善'
    ];

    const sparkColors = [
      '#ff4d6d', '#ffb703', '#ffd166', '#00b4d8',
      '#06d6a0', '#b5179e', '#fb8500', '#4361ee',
      '#ef476f', '#f9c74f', '#f72585', '#2ec4b6'
    ];

    // light = 深底用浅字；dark = 浅底用深字
    const palettes = {
      light: ['#ffffff', '#ffe066', '#a0f0ff', '#ffb3c1', '#b8ffb0',
              '#e0c3fc', '#ffd6a5', '#caffbf', '#fdffb6', '#9bf6ff'],
      dark:  ['#1a1a2e', '#2d3436', '#3d0c02', '#0b3d91', '#1b4332',
                '#5a189a', '#7a2e0e', '#004e64', '#203239', '#4a1c40']
    };

    function randomOf(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function spawnSpark(x, y) {
      try {
        const words = shuffle(coreValues);
        const total = words.length;

        words.forEach(function (word, i) {
          const el = document.createElement('div');
          el.className = 'spark';
          el.textContent = word;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.color = randomOf(sparkColors);
          el.style.fontSize = (12 + Math.random() * 8).toFixed(1) + 'px';
          el.style.transform = 'translate(-50%, -50%)';
          document.body.appendChild(el);

          const angle = (Math.PI * 2 * i) / total + (Math.random() - 0.5) * 0.55;
          const dist = 70 + Math.random() * 95;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist - 32;
          const rot = (Math.random() - 0.5) * 90;

          const keyframes = [
            { transform: 'translate(-50%, -50%) scale(0.4) rotate(0deg)', opacity: 0 },
            {
              transform: 'translate(-50%, -50%) translate(' + (dx * 0.42).toFixed(1) + 'px, ' + (dy * 0.42).toFixed(1) + 'px) scale(1.12) rotate(' + (rot * 0.45).toFixed(1) + 'deg)',
              opacity: 1, offset: 0.28
            },
            {
              transform: 'translate(-50%, -50%) translate(' + dx.toFixed(1) + 'px, ' + (dy - 26).toFixed(1) + 'px) scale(0.85) rotate(' + rot.toFixed(1) + 'deg)',
              opacity: 0
            }
          ];

          try {
            el.animate(keyframes, {
              duration: 900 + Math.random() * 400,
              easing: 'cubic-bezier(.16,.84,.32,1)',
              fill: 'forwards'
            });
          } catch (animErr) {
            el.style.transition = 'opacity .8s ease';
            el.style.opacity = '0';
          }

          setTimeout(function () { el.remove(); }, 1600);
        });
      } catch (err) {
        console.error('spawnSpark error:', err);
      }
    }

    function pickLine() {
      if (!textEl) return randomOf(lines);
      let line = randomOf(lines);
      let guard = 0;
      while (line === textEl.textContent && guard++ < 8) {
        line = randomOf(lines);
      }
      return line;
    }

    function pickColor(tone) {
      const pool = palettes[tone] || palettes.light;
      let c = randomOf(pool);
      let guard = 0;
      while (c === lastColor && guard++ < 8) {
        c = randomOf(pool);
      }
      lastColor = c;
      return c;
    }

    // 关键修复：文字更新放在最前面，每一步独立 try-catch，
    // 任何一步失败都不影响其它步骤，确保“背景变、文字也变”
    function trigger() {
      // 1) 计数器
      if (counterEl) {
        try { counterEl.textContent = '点击 ' + (++clicks) + ' 次'; } catch (e) {}
      } else {
        clicks++;
      }

      // 2) 先随机出背景主题（只决定配色 tone，不立即应用）
      let idx = Math.floor(Math.random() * backgrounds.length);
      let guard = 0;
      while (idx === lastBgIndex && guard++ < 8) {
        idx = Math.floor(Math.random() * backgrounds.length);
      }
      lastBgIndex = idx;
      const theme = backgrounds[idx];
      const isLightBg = theme.tone === 'light';

      // 3) 【优先】更新文字内容 + 颜色
      if (textEl) {
        // 3a. 文字内容（先改内容，保证内容一定变）
        try {
          textEl.classList.remove('show');
          void textEl.offsetWidth;              // 强制回流，重启过渡
          textEl.textContent = pickLine();
          textEl.classList.add('show');
        } catch (e) {
          console.warn('文字内容更新失败:', e);
        }

        // 3b. 文字颜色（独立 try-catch，内容失败也不影响颜色）
        try {
          textEl.style.color = pickColor(theme.tone);
          textEl.style.textShadow = isLightBg
            ? '0 2px 18px rgba(0,0,0,.28), 0 1px 4px rgba(0,0,0,.25)'
            : '0 2px 16px rgba(255,255,255,.65), 0 1px 3px rgba(0,0,0,.18)';
        } catch (e) {
          console.warn('文字颜色更新失败:', e);
        }
      }

      // 4) 更新背景（文字已更新完，这里失败也不影响文字）
      try { document.body.style.background = theme.bg; } catch (e) {}

      // 5) 更新辅助元素（hint / counter 颜色），空值保护
      if (hintEl) {
        try {
          hintEl.style.color = isLightBg ? 'rgba(255,255,255,.85)' : 'rgba(35,35,50,.55)';
          hintEl.style.textShadow = isLightBg
            ? '0 1px 6px rgba(0,0,0,.3)'
            : '0 1px 6px rgba(255,255,255,.7)';
        } catch (e) {}
      }
      if (counterEl) {
        try {
          counterEl.style.color = isLightBg ? 'rgba(255,255,255,.9)' : 'rgba(35,35,50,.68)';
        } catch (e) {}
      }
    }

    // 移动端：touchstart 先放特效
    let lastTouchAt = 0;

    document.body.addEventListener('touchstart', function (e) {
      lastTouchAt = Date.now();
      const t = e.touches[0];
      if (t) spawnSpark(t.clientX, t.clientY);
    }, { passive: true });

    // 点击：先更新文字和背景，再放特效
    document.body.addEventListener('click', function (e) {
      trigger();
      if (Date.now() - lastTouchAt > 600) {
        spawnSpark(e.clientX, e.clientY);
      }
    });

    // 初始显示
    if (textEl) {
      textEl.style.color = '#ffffff';
      textEl.classList.add('show');
    }
  })();
</script>
</body>
</html>
